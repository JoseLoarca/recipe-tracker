repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/(app|bot)/
        additional_dependencies: [pydantic, pydantic-settings]

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint
        entry: sh -c 'cd frontend && npm run lint'
        language: system
        files: ^frontend/
        pass_filenames: false
